name: CI & Auto Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: 🔎 Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  release:
    needs: govulncheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Check and Create GitHub Release & Tag from .release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f .release ]; then
            echo "ℹ️  No .release file found, skipping."
            exit 0
          fi

          RAW_VERSION=$(cat .release | tr -d '[:space:]')
          if [ -z "$RAW_VERSION" ]; then
            echo "⚠️  .release file is empty, skipping."
            exit 0
          fi

          if [[ "$RAW_VERSION" =~ ^v ]]; then
            TAG="$RAW_VERSION"
          else
            TAG="v$RAW_VERSION"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ GitHub Release $TAG already exists. Nothing to do."
          else
            echo "🚀 Creating GitHub Release & Tag: $TAG"
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes
          fi
