name: Go Vulnerability Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: 🔎 Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
